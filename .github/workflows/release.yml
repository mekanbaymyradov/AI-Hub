name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the main check below needs history
      - name: Check the tag
        run: |
          # The tag reaches a shell on the server, so allow only vX.Y.Z.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-hub:${{ github.ref_name }}
          # Links the package to this repo on GitHub.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          # Pinned host key, so the job refuses to talk to an impostor.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the compose file
        run: scp docker-compose.prod.yaml "$TARGET:/opt/ai-hub/docker-compose.yaml"
      - name: Migrate and restart
        run: |
          # shellcheck disable=SC2029  # TAG expands here on purpose; publish allows only vX.Y.Z
          ssh "$TARGET" "TAG=$TAG bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/ai-hub
          grep -q '^IMAGE_TAG=' .env || { echo "IMAGE_TAG= line missing from .env" >&2; exit 1; }

          # Overrides .env until the migration succeeds, so a failed one leaves
          # .env naming the version that is still running.
          export IMAGE_TAG="$TAG"
          docker compose pull app scheduler
          # </dev/null: otherwise `run` reads the rest of this script from stdin.
          docker compose run --rm app alembic upgrade head </dev/null
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env

          docker compose up -d --wait --wait-timeout 120 --remove-orphans
          docker image prune -af
          EOF
