name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the main check below needs history
      - name: Check the tag
        run: |
          # The tag reaches a shell on the server, so allow only vX.Y.Z.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.ref_name }}  # its image job pushes the image it tested
    # A called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          # Pinned host key, so the job refuses to talk to an impostor.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload the deploy files
        # To a staging directory, so a failed migration leaves the live files alone.
        run: |
          ssh "$TARGET" 'rm -rf /opt/ai-hub/incoming && mkdir /opt/ai-hub/incoming'
          scp deploy/* "$TARGET:/opt/ai-hub/incoming/"
      - name: Deploy
        run: |
          # shellcheck disable=SC2029  # TAG expands here on purpose; check-tag allows only vX.Y.Z
          ssh "$TARGET" "bash /opt/ai-hub/incoming/deploy.sh $TAG"
