name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # release.yml runs these checks for the tagged commit
    inputs:
      tag:
        description: Push the tested images under this tag
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Python comes from .python-version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: shellcheck deploy/deploy.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same tags as deploy/docker-compose.yaml. Dependabot doesn't bump workflow
    # service images, so update these by hand with it.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest

  # The image job's build runs `npm run build`, which also type-checks.
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Rehearses the deploy: the prod compose stack, run with the images built
  # here. Release runs then push those same images.
  image:
    needs: [lint, test, frontend-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-hub:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-hub-frontend:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Its own scope: the default one holds the API image's cache, which
          # this build would otherwise overwrite.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Placeholder settings for the prod compose stack. None of these are real secrets.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          IMAGE_TAG=ci
          API_DOMAIN=localhost
          WEB_DOMAIN=web.localhost

          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=app
          REDIS_PASSWORD=ci

          JWT_SECRET=ci-secret-at-least-32-bytes-long-0000
          RESEND_API_KEY=ci
          EMAIL_FROM=ci@example.com

          S3_ENDPOINT_URL=http://localhost:1
          S3_ACCESS_KEY_ID=ci
          S3_SECRET_ACCESS_KEY=ci
          S3_PUBLIC_BUCKET=ci-public
          S3_PRIVATE_BUCKET=ci-private
          S3_PUBLIC_BASE_URL=https://cdn.example.com
          EOF
      - run: docker compose run --rm --no-deps otel-collector validate --config=/etc/otelcol-contrib/config.yaml
      - run: docker compose run --rm app alembic upgrade head
      # Fails when the models changed without a migration.
      - run: docker compose run --rm app alembic check
      - run: docker compose up -d --wait --wait-timeout 120 app caddy frontend
      # Through Caddy, which may still be issuing its local certificate.
      - run: curl -sSkf --retry 10 --retry-all-errors --retry-delay 1 https://localhost/healthz
      - name: Check the frontend through Caddy
        run: |
          web=(-sSk --resolve web.localhost:443:127.0.0.1 --retry 10 --retry-all-errors --retry-delay 1)
          headers=$(curl "${web[@]}" -f -o /dev/null -D - https://web.localhost/)
          grep -i '^content-security-policy' <<<"$headers"
          grep -i '^strict-transport-security' <<<"$headers"
          # A router path gets index.html, so deep links and reloads work.
          curl "${web[@]}" -f https://web.localhost/chats/123 | grep '<div id="root">'
          test "$(curl "${web[@]}" -o /dev/null -w '%{http_code}' https://web.localhost/assets/missing.js)" = 404
      - run: docker compose run --rm --no-deps scheduler supercronic -test /app/crontab
      # A plain truthy check: on PR and push runs `inputs.tag` is null.
      - if: inputs.tag
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.tag
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
        run: |
          for image in ai-hub ai-hub-frontend; do
            docker tag "$REGISTRY/$image:ci" "$REGISTRY/$image:$TAG"
            docker push "$REGISTRY/$image:$TAG"
          done
      - if: failure()
        run: docker compose logs
