version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Logfire decides which OpenTelemetry version it supports; bumping these
      # alone pulls in a Logfire pre-release.
      - dependency-name: "opentelemetry-*"
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # /frontend holds the node image and the Caddy image that serves the build.
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dockerfile:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new Postgres major version needs a dump and restore, not a tag bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose:
        update-types: [minor, patch]
