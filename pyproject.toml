[project]
name = "ai-hub"
version = "1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "boto3-stubs[s3]>=1.35",
    "boto3>=1.35",
    "fastapi[standard]>=0.141.1",
    "logfire[fastapi,httpx,sqlalchemy,redis]>=4.41.0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "psycopg[binary]>=3.3.5",
    "pydantic-ai[groq]>=2.33.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.9",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.logfire]
# A missing token disables sending instead of crashing startup. Set here, not
# in logfire.configure(), so the env var in tests/conftest.py still overrides it.
send_to_logfire = "if-token-present"

[tool.ruff]

[tool.ruff.lint]
extend-select = ["FAST", "D"]
ignore = [
    "D1",  # check the docstrings we write, never require one
    "BLE001",  # blind excepts log via logfire.exception(), which ruff cannot recognize
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D401"]  # fixture docstrings read as nouns
"migrations/**" = ["D"]  # Alembic-generated headers

[dependency-groups]
dev = [
    "asgi-lifespan==2.*",
    "httpx2>=2.13.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*"
]


